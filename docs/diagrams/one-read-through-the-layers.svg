<title id="one-read-through-the-layers-title">One read through the layers</title>
<desc id="one-read-through-the-layers-desc">A channel read through the layers: the first ReadChannel sends a select word and two continue words through your port to get the result, and a repeat read of the same channel needs one continue word.</desc>
