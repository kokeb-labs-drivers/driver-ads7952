<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1002" viewBox="0 0 1200 1002" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the ADS7952 does</title>
<desc id="chip-capabilities-desc">Capability map of the ADS7952: Manual mode (supported): Converts the channel each frame names; the result comes two frames later, tagged with its channel; Auto-1 sequence (supported): Scans a programmed list of channels in ascending order, one per frame; Auto-2 sequence (supported): Scans from channel 0 up to a programmed last channel, one per frame; Input range (supported): Selects 0 to VREF or 0 to 2 x VREF, and converts codes to microvolts; Alarm thresholds (supported): A high and a low threshold per channel, signalled on GPIO0 and GPIO1; GPIOs (supported): Four pins on TSSOP, one on VQFN, each an input or an output, read and written with the frames; Power-down (supported): Powers the chip down at the end of a frame, by command or by the GPIO3 input; Reset and checks (supported): Resets every register by command, waits the power-up time and checks that the chip answers.</desc>
