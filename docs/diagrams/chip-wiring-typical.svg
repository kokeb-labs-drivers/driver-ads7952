<text x="50" y="574.5" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="598" font-size="17" fill="#9F1239">+5V: +VA; also U3.VIN · +3V3: +VBD; also U2.VDD · GND: AGND, AINM, BDGND, NC, REFM; also U2.GND, U3.GND</text>
<text x="50" y="667.5" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="691" font-size="17" fill="#334155">Support parts: 5 capacitors around the supplies (values in the full schematic). Not wired in this circuit (14): CH2, CH3, CH4, CH5,</text>
<text x="50" y="715.6" font-size="17" fill="#334155">CH6, CH7, CH8, CH9, CH10, CH11, GPIO0, GPIO1, GPIO2, GPIO3.</text>
<text x="32" y="761.6" font-size="16" fill="#566070">* Not confirmed in the datasheet: net +5V: example +VA; the datasheet allows 2.7 V to 5.25 V; net +3V3: example +VBD; the datasheet</text>
<text x="32" y="784.7" font-size="16" fill="#566070">allows 1.7 V to +VA; U3: Figure 60 shows only the reference's output; its supply and decoupling are the reference's own.</text>
