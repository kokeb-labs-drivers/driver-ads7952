<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="842" viewBox="0 0 1200 842" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">ADS7952</title>
<desc id="chip-hero-desc">Overview of the ADS7952, a 12-channel, 12-bit SAR analog-to-digital converter that samples one single-ended input per 16-bit SPI frame at up to 1 MSPS, in a manual order or in one of two automatic sequences. A MCU talks to it over SPI; it drives GPIO0 to GPIO3; it reads back Analog inputs, External reference. Headline figures: 12 x 12-bit single-ended inputs, one ADC; 1 MSPS sample rate; 20 MHz SPI clock, one 16-bit frame per sample; 2.7 to 5.25 V analog supply; I/O 1.7 to 5.25 V; 0 to 2 x VREF input range, or 0 to VREF; 1 µA power-down current.</desc>
