<rect x="602" y="306.8" width="178" height="46" rx="6" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.2"/>
<rect x="222" y="441.8" width="178" height="46" rx="6" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.2"/>
<rect x="412" y="441.8" width="178" height="46" rx="6" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.2"/>
<rect x="602" y="441.8" width="178" height="46" rx="6" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.2"/>
<rect x="792" y="441.8" width="178" height="46" rx="6" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.2"/>
<rect x="982" y="441.8" width="178" height="46" rx="6" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.2"/>
<rect x="222" y="499.8" width="178" height="46" rx="6" fill="#F1F4F8" stroke="#64748B" stroke-width="1.2"/>
<rect x="412" y="499.8" width="178" height="46" rx="6" fill="#F1F4F8" stroke="#64748B" stroke-width="1.2"/>
<rect x="602" y="499.8" width="178" height="46" rx="6" fill="#F1F4F8" stroke="#64748B" stroke-width="1.2"/>
<rect x="792" y="499.8" width="178" height="46" rx="6" fill="#F1F4F8" stroke="#64748B" stroke-width="1.2"/>
<rect x="982" y="499.8" width="178" height="46" rx="6" fill="#F1F4F8" stroke="#64748B" stroke-width="1.2"/>
