<rect x="792" y="557.8" width="178" height="46" rx="6" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.2"/>
<rect x="982" y="557.8" width="178" height="46" rx="6" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.2"/>
<rect x="32" y="627.8" width="1136" height="79.3" rx="10" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="32" y="152.8" font-size="15" font-weight="700" fill="#0E1726">Manual: ReadChannel(4), 3 frames (1 when channel 4 is already selected)</text>
<text x="311" y="180.8" font-size="12" text-anchor="middle" fill="#566070">frame N</text>
<text x="501" y="180.8" font-size="12" text-anchor="middle" fill="#566070">frame N + 1</text>
<text x="691" y="180.8" font-size="12" text-anchor="middle" fill="#566070">frame N + 2</text>
<text x="32" y="218.5" font-size="13" font-weight="600" fill="#0E1726">SDI: the driver sends</text>
<text x="311" y="218.5" font-size="13" font-weight="600" text-anchor="middle" fill="#7A360E">Manual, CH4</text>
<text x="501" y="218.5" font-size="13" font-weight="600" text-anchor="middle" fill="#7A360E">continue</text>
<text x="691" y="218.5" font-size="13" font-weight="600" text-anchor="middle" fill="#7A360E">Manual, CH4</text>
<text x="32" y="276.5" font-size="13" font-weight="600" fill="#0E1726">Multiplexer acquires</text>
<text x="311" y="276.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CHy</text>
<text x="501" y="276.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CH4</text>
<text x="691" y="276.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CH4</text>
<text x="32" y="334.5" font-size="13" font-weight="600" fill="#0E1726">SDO: the reply</text>
<text x="311" y="334.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CHx</text>
<text x="501" y="334.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CHy</text>
<text x="691" y="334.5" font-size="13" font-weight="600" text-anchor="middle" fill="#8A3C0B">CH4</text>
<text x="32" y="403.8" font-size="15" font-weight="700" fill="#0E1726">Auto-1, channels 2, 5, 6: ReadAuto1(), 3 + 2 frames to enter, then 3</text>
<text x="311" y="431.8" font-size="12" text-anchor="middle" fill="#566070">frame N</text>
<text x="501" y="431.8" font-size="12" text-anchor="middle" fill="#566070">frame N + 1</text>
<text x="691" y="431.8" font-size="12" text-anchor="middle" fill="#566070">frame N + 2</text>
<text x="881" y="431.8" font-size="12" text-anchor="middle" fill="#566070">frame N + 3</text>
<text x="1071" y="431.8" font-size="12" text-anchor="middle" fill="#566070">frame N + 4</text>
<text x="32" y="469.5" font-size="13" font-weight="600" fill="#0E1726">SDI: the driver sends</text>
<text x="311" y="469.5" font-size="13" font-weight="600" text-anchor="middle" fill="#7A360E">Auto-1, restart</text>
<text x="501" y="469.5" font-size="13" font-weight="600" text-anchor="middle" fill="#7A360E">continue</text>
<text x="691" y="469.5" font-size="13" font-weight="600" text-anchor="middle" fill="#7A360E">Auto-1</text>
<text x="881" y="469.5" font-size="13" font-weight="600" text-anchor="middle" fill="#7A360E">Auto-1</text>
<text x="1071" y="469.5" font-size="13" font-weight="600" text-anchor="middle" fill="#7A360E">Auto-1</text>
<text x="32" y="527.5" font-size="13" font-weight="600" fill="#0E1726">Multiplexer acquires</text>
<text x="311" y="527.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CHy</text>
<text x="501" y="527.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CH2</text>
<text x="691" y="527.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CH5</text>
<text x="881" y="527.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CH6</text>
<text x="1071" y="527.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CH2</text>
<text x="32" y="585.5" font-size="13" font-weight="600" fill="#0E1726">SDO: the reply</text>
<text x="311" y="585.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CHx</text>
<text x="501" y="585.5" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CHy</text>
<text x="691" y="585.5" font-size="13" font-weight="600" text-anchor="middle" fill="#8A3C0B">CH2</text>
<text x="881" y="585.5" font-size="13" font-weight="600" text-anchor="middle" fill="#8A3C0B">CH5</text>
<text x="1071" y="585.5" font-size="13" font-weight="600" text-anchor="middle" fill="#8A3C0B">CH6</text>
<text x="46" y="654.5" font-size="15" font-weight="700" fill="#7A360E">Keyed on the address</text>
<text x="46" y="672.3" font-size="13" fill="#7A360E">Every reply carries its channel address in DO15:12. The driver checks it on every result it returns, so a lost frame, a reset chip or a dead SDI line is an error, never a result</text>
<text x="46" y="691.2" font-size="13" fill="#7A360E">for the wrong channel.</text>
<rect x="32" y="722.5" width="14" height="14" rx="4" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<text x="54" y="734.2" font-size="12.5" fill="#566070">word on SDI</text>
<rect x="154.7" y="722.5" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="176.7" y="734.2" font-size="12.5" fill="#566070">acquired, or a reply skipped</text>
<rect x="375.8" y="722.5" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="397.8" y="734.2" font-size="12.5" fill="#566070">reply returned</text>
</svg>
