<text x="152" y="184.6" font-size="13" font-weight="700" fill="#E2E8F0">ADS7952</text>
<text x="227.5" y="184.6" font-size="12" fill="#E2E8F0">TSSOP-38</text>
<text x="196" y="250.3" font-size="15" font-weight="700" fill="#A7F3E6">Input multiplexer</text>
<text x="196" y="275.1" font-size="13" fill="#D2DAE4">12 channels, one to MXO</text>
<text x="612" y="250.3" font-size="15" font-weight="700" fill="#DDD6FE">12-bit SAR ADC</text>
<text x="612" y="275.1" font-size="13" fill="#D2DAE4">1 MSPS, Range 1 or 2</text>
<text x="196" y="618.3" font-size="15" font-weight="700" fill="#BFDBFE">Control logic and sequencing</text>
<text x="196" y="643.2" font-size="13" fill="#D2DAE4">SPI frame, modes, GPIO</text>
<text x="612" y="618.3" font-size="15" font-weight="700" fill="#FDE68A">Compare</text>
<text x="612" y="643.2" font-size="13" fill="#D2DAE4">result against thresholds</text>
<text x="612" y="890.3" font-size="15" font-weight="700" fill="#FDE68A">Alarm thresholds</text>
<text x="612" y="915.2" font-size="13" fill="#D2DAE4">high and low per channel</text>
