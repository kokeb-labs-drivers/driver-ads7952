---
# Model of the figure 'one-read-through-the-layers'. Edit this file; `kokeb-docs figures` draws it. Never edit the SVGs.
kind: seq
id: one-read-through-the-layers
title: "One read through the layers"
alt: >-
  A channel read through the layers: the first ReadChannel sends a select word and two continue words through your
  port to get the result, and a repeat read of the same channel needs one continue word.
reads: >-
  Participants, left to right: Your code, ADS7952<Port> and Your port. The steps run from top to bottom. Your code sends ReadChannel(4) to ADS7952<Port>. ADS7952<Port> sends Transfer(0x1A00: Manual, DI11, channel 4) to Your port. Your port returns true, reply of an earlier channel to ADS7952<Port>. ADS7952<Port> sends Transfer(0x0000: continue) to Your port. Your port returns true, reply acquired before the select to ADS7952<Port>. ADS7952<Port> sends Transfer(0x0000: continue) to Your port. Your port returns true, 0x4xxx: address 4, the result to ADS7952<Port>. ADS7952<Port> returns Result<uint16_t>{code, Ok} to Your code. Your code sends ReadChannel(4) to ADS7952<Port>. ADS7952<Port> sends Transfer(0x0000: continue) to Your port. Your port returns true, 0x4xxx to ADS7952<Port>. ADS7952<Port> returns Result<uint16_t>{code, Ok} to Your code.
print: landscape
sources:
  - docs/model/one-read-through-the-layers.seq.yml
participants:
  - {id: app, label: "Your code", tone: magenta}
  - {id: core, label: "ADS7952<Port>", tone: green}
  - {id: port, label: "Your port", tone: teal}
steps:
  - {from: app, to: core, label: "ReadChannel(4)"}
  - {from: core, to: port, label: "Transfer(0x1A00: Manual, DI11, channel 4)"}
  - {from: port, to: core, label: "true, reply of an earlier channel", return: true}
  - {from: core, to: port, label: "Transfer(0x0000: continue)"}
  - {from: port, to: core, label: "true, reply acquired before the select", return: true}
  - {from: core, to: port, label: "Transfer(0x0000: continue)"}
  - {from: port, to: core, label: "true, 0x4xxx: address 4, the result", return: true}
  - {from: core, to: app, label: "Result<uint16_t>{code, Ok}", return: true}
  - {from: app, to: core, label: "ReadChannel(4)"}
  - {from: core, to: port, label: "Transfer(0x0000: continue)"}
  - {from: port, to: core, label: "true, 0x4xxx", return: true}
  - {from: core, to: app, label: "Result<uint16_t>{code, Ok}", return: true}
