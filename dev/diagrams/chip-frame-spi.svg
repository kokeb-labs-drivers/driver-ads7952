<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="664" viewBox="0 0 1200 664" role="img" aria-labelledby="chip-frame-spi-title chip-frame-spi-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-spi-title">ADS7952: SPI frame</title>
<desc id="chip-frame-spi-desc">SPI frame of the ADS7952, 16 bits, most significant bit first. Manual: mode (bits 15 to 12), program (bit 11), channel (bits 10 to 7), range (bit 6), power down (bit 5), GPIO read (bit 4), GPIO data (bits 3 to 0); Reply: channel address (bits 15 to 12), 12-bit result (bits 11 to 0). Below, the SPI mode 0 waveform of one transfer in the same bit grid.</desc>
<rect x="0.5" y="0.5" width="1199" height="663" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">ADS7952: SPI frame</text>
<text x="32" y="115.4" font-size="18" fill="#566070">Every conversion is one 16-bit frame with CS low; SDI here is the Manual-mode word, SDO the result. 16 bits, sent most</text>
<text x="32" y="141.5" font-size="18" fill="#566070">significant bit first. Datasheet: 8.4.4 Operating in Manual Mode, Table 1, p. 33.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#E2E7EE"/>
