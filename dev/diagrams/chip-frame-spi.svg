<text x="237" y="191.5" font-size="16" fill="#566070">MSB, sent first</text>
<text x="1140" y="191.5" font-size="16" text-anchor="end" fill="#566070">LSB, sent last</text>
<text x="32" y="230.5" font-size="20" font-weight="700" fill="#0E1726">Manual</text>
<text x="32" y="250.5" font-size="16" fill="#566070">SDI, DI15:12 = 0001</text>
<text x="349.9" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#8A3C0B">mode</text>
<text x="239" y="275.5" font-size="16" fill="#566070">15</text>
<text x="460.8" y="275.5" font-size="16" text-anchor="end" fill="#566070">12</text>
<text x="491" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#5B21B6">P</text>
<text x="491" y="275.5" font-size="16" text-anchor="middle" fill="#566070">11</text>
<text x="632.1" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#1E429F">channel</text>
<text x="521.2" y="275.5" font-size="16" fill="#566070">10</text>
<text x="742.9" y="275.5" font-size="16" text-anchor="end" fill="#566070">7</text>
<text x="773.2" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#0B5F59">range</text>
<text x="773.2" y="275.5" font-size="16" text-anchor="middle" fill="#566070">6</text>
<text x="829.6" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#9F1239">PD</text>
<text x="829.6" y="275.5" font-size="16" text-anchor="middle" fill="#566070">5</text>
<text x="886" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#334155">G</text>
<text x="886" y="275.5" font-size="16" text-anchor="middle" fill="#566070">4</text>
<text x="1027.1" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#14532D">GPIO data</text>
<text x="916.2" y="275.5" font-size="16" fill="#566070">3</text>
<text x="1138" y="275.5" font-size="16" text-anchor="end" fill="#566070">0</text>
<text x="32" y="318.5" font-size="20" font-weight="700" fill="#0E1726">Reply</text>
<text x="32" y="338.5" font-size="16" fill="#566070">SDO, DI04 = 0</text>
<text x="349.9" y="326.6" font-size="17" font-weight="600" text-anchor="middle" fill="#1E429F">channel address</text>
<text x="239" y="363.5" font-size="16" fill="#566070">15</text>
<text x="460.8" y="363.5" font-size="16" text-anchor="end" fill="#566070">12</text>
