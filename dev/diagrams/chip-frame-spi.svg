<text x="464.8" y="363.5" font-size="16" fill="#566070">11</text>
<text x="1138" y="363.5" font-size="16" text-anchor="end" fill="#566070">0</text>
<text x="32" y="414.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">CS</text>
<text x="32" y="460.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SCLK</text>
<text x="32" y="506.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SDI</text>
<text x="349.9" y="506.3" font-size="16" font-weight="600" text-anchor="middle" fill="#8A3C0B">mode</text>
<text x="491" y="506.3" font-size="16" font-weight="600" text-anchor="middle" fill="#5B21B6">P</text>
<text x="632.1" y="506.3" font-size="16" font-weight="600" text-anchor="middle" fill="#1E429F">channel</text>
<text x="773.2" y="506.3" font-size="16" font-weight="600" text-anchor="middle" fill="#0B5F59">R</text>
<text x="829.6" y="506.3" font-size="16" font-weight="600" text-anchor="middle" fill="#9F1239">PD</text>
<text x="886" y="506.3" font-size="16" font-weight="600" text-anchor="middle" fill="#334155">G</text>
<text x="1027.1" y="506.3" font-size="16" font-weight="600" text-anchor="middle" fill="#14532D">GPIO</text>
<text x="32" y="552.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SDO</text>
<text x="349.9" y="552.3" font-size="16" font-weight="600" text-anchor="middle" fill="#1E429F">addr</text>
<text x="801.4" y="552.3" font-size="16" font-weight="600" text-anchor="middle" fill="#14532D">12-bit result</text>
<text x="32" y="594.3" font-size="16" fill="#566070">SPI mode 0: SCLK idles low; the chip samples its input on the rising edge and changes its output after the falling edge. CS stays low for the</text>
<text x="32" y="617.5" font-size="16" fill="#566070">whole frame.</text>
</svg>
