<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="768" viewBox="0 0 1200 768" role="img" aria-labelledby="frame-pipeline-title frame-pipeline-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="frame-pipeline-title">A result comes back two frames after its channel</title>
<desc id="frame-pipeline-desc">Two timing grids of 16-bit frames. Manual: a Manual word selects channel 4 in frame N, the multiplexer acquires it in frame N + 1 and its result comes back in frame N + 2. Auto-1: the Auto-1 word restarts the sequence 2, 5, 6 in frame N, and from frame N + 2 on every Auto-1 word returns the next channel.</desc>
<rect x="0.5" y="0.5" width="1199" height="767" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">ARCHITECTURE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">A result comes back two frames after its channel</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">One column per frame. The amber replies are the ones the driver returns; the grey ones it skips.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#252F3C"/>
