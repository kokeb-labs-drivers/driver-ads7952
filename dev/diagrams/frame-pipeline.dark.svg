<rect x="982" y="441.8" width="178" height="46" rx="6" fill="#2A2113" stroke="#F4B942" stroke-width="1.2"/>
<rect x="222" y="499.8" width="178" height="46" rx="6" fill="#1B232E" stroke="#94A3B8" stroke-width="1.2"/>
<rect x="412" y="499.8" width="178" height="46" rx="6" fill="#1B232E" stroke="#94A3B8" stroke-width="1.2"/>
<rect x="602" y="499.8" width="178" height="46" rx="6" fill="#1B232E" stroke="#94A3B8" stroke-width="1.2"/>
