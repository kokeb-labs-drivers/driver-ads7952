<text x="152" y="184.6" font-size="13" font-weight="700" fill="#334155">ADS7952</text>
<text x="227.5" y="184.6" font-size="12" fill="#334155">TSSOP-38</text>
<text x="196" y="250.3" font-size="15" font-weight="700" fill="#0B5F59">Input multiplexer</text>
<text x="196" y="275.1" font-size="13" fill="#2B3442">12 channels, one to MXO</text>
<text x="612" y="250.3" font-size="15" font-weight="700" fill="#5B21B6">12-bit SAR ADC</text>
<text x="612" y="275.1" font-size="13" fill="#2B3442">1 MSPS, Range 1 or 2</text>
<text x="196" y="618.3" font-size="15" font-weight="700" fill="#1E429F">Control logic and sequencing</text>
<text x="196" y="643.2" font-size="13" fill="#2B3442">SPI frame, modes, GPIO</text>
<text x="612" y="618.3" font-size="15" font-weight="700" fill="#8A3C0B">Compare</text>
<text x="612" y="643.2" font-size="13" fill="#2B3442">result against thresholds</text>
<text x="612" y="890.3" font-size="15" font-weight="700" fill="#8A3C0B">Alarm thresholds</text>
<text x="612" y="915.2" font-size="13" fill="#2B3442">high and low per channel</text>
